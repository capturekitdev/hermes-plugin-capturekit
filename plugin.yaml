name: capturekit
version: 1.1.0
description: "Web pages for Hermes: clean Markdown of any page, screenshots and PDFs (full page, element or mobile view), and AI page analysis, through the CaptureKit API. Also a web_extract backend."
author: CaptureKit
license: MIT
kind: backend
requires_hermes: ">=0.21.6"
provides_web_providers:
  - capturekit
provides_tools:
  - capturekit_page_content
  - capturekit_screenshot
  - capturekit_analyze
  - capturekit_usage
provides_hooks: []
provides_middleware: []
requires_env:
  - name: CAPTUREKIT_API_KEY
    description: CaptureKit API key
    url: https://app.capturekit.dev
    secret: true
config_schema:
  api_key:
    type: secret
    env: CAPTUREKIT_API_KEY
    label: CaptureKit API key
  main_content_only:
    type: bool
    default: true
    label: Main content only
    description: Keep the main content of each page and drop navigation, footers and sidebars.
